services:
  stockledger-postgres:
    image: postgres:16.4-alpine
    container_name: stockledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - shared_network

  stockledger-database:
    image: node:22.13.0-slim
    container_name: stockledger-database
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "4010:4010"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      PORT: 4010
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@stockledger-postgres:5432/${POSTGRES_DB}
    depends_on:
      stockledger-postgres:
        condition: service_healthy
    command: sh -c "npm install && npm start"
    networks:
      - shared_network

volumes:
  pgdata:

networks:
  shared_network:
    name: shared_network
