databases:
  - name: stockledger-postgres
    databaseName: stockledger
    user: stockledger
    plan: free

services:
  # ─── Database migration / seed job ─────────────────────────────────────────
  - type: worker
    name: stockledger-database
    runtime: node
    rootDir: stockledger__database
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4010
      - key: DATABASE_URL
        fromDatabase:
          name: stockledger-postgres
          property: connectionString

  # ─── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: stockledger-backend
    runtime: node
    rootDir: stockledger__backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4020
      - key: DATABASE_URL
        fromDatabase:
          name: stockledger-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: BCRYPT_ROUNDS
        value: 12

  # ─── Frontend (static site) ─────────────────────────────────────────────────
  - type: web
    name: stockledger-frontend
    runtime: static
    rootDir: stockledger__frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: stockledger-backend
          type: web
          property: host
