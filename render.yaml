# render.yaml — InvenTrack Render Blueprint
# Deploys: PostgreSQL database + Node/Express backend + React/Vite frontend
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── 1. Backend (Web Service — Docker) ────────────────────────────────────────
  - type: web
    name: inventrack-backend
    runtime: docker
    dockerfilePath: ./inventrack__backend/Dockerfile
    dockerContext: ./inventrack__backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4010"
      - key: DATABASE_URL
        fromDatabase:
          name: inventrack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: CORS_ORIGIN
        fromService:
          name: inventrack-frontend
          type: web
          property: host
          transform: "https://{value}"

  # ── 2. Frontend (Static Site) ────────────────────────────────────────────────
  - type: web
    name: inventrack-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    rootDir: inventrack__frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: inventrack-backend
          type: web
          property: host
          transform: "https://{value}"

# ── 3. Database (PostgreSQL) ──────────────────────────────────────────────────
databases:
  - name: inventrack-db
    plan: free
    databaseName: inventrack_db
    user: inventrack
